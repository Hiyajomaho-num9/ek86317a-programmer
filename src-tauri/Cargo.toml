[package]
name = "ek86317a-programmer"
version = "0.5.1"
description = "EK86317A TCON Programmer via FTDI/WCH I2C bridges"
authors = ["you"]
edition = "2021"

[lib]
name = "ek86317a_programmer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libftd2xx = { version = "0.32", features = ["static"], optional = true }
# default-features = false 关掉 libudev：Linux 上没有 libudev-dev 也能编，
# 热插拔事件用不上，端口枚举照样工作。
serialport = { version = "4", default-features = false }
# 终端输出按原始字节回传，base64 编一下避免 JSON 数组把体积放大四倍
base64 = "0.22"

[features]
default = ["custom-protocol", "all-bridges"]
custom-protocol = ["tauri/custom-protocol"]
ftdi = ["libftd2xx"]
ch347f = []
uart = []
all-bridges = ["ftdi", "ch347f", "uart"]

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
