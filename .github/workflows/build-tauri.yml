name: build-tauri

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            linux: true
            args: --features all-bridges --bundles deb
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            linux: true
            args: --features all-bridges --bundles deb
          - os: windows-latest
            platform: windows-x64
            linux: false
            args: --features all-bridges --bundles nsis
          - os: macos-latest
            platform: macos-arm64
            linux: false
            args: --features all-bridges --bundles app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const tauri = require('./src-tauri/tauri.conf.json');
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8')
            .match(/^version = "([^"]+)"/m)?.[1];
          const versions = {
            'package.json': pkg.version,
            'package-lock.json': lock.version,
            'package-lock.json packages root': lock.packages?.['']?.version,
            'src-tauri/tauri.conf.json': tauri.version,
            'src-tauri/Cargo.toml': cargo,
          };
          let ok = true;
          for (const [file, version] of Object.entries(versions)) {
            if (version !== expected) {
              console.error(`${file}: ${version} != tag ${expected}`);
              ok = false;
            }
          }
          if (!ok) process.exit(1);
          console.log(`Release version OK: ${expected}`);
          NODE

      - name: Build app and optionally publish Release assets
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('EK86317A Programmer {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/v') && 'Automated build from GitHub Actions.' || '' }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: Upload workflow artifacts for manual builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ek86317a-programmer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
            src-tauri/target/release/ek86317a-programmer*
